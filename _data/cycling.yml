# Cycling: the "Cycling" card in Stamps collected and the /cycling/ page.

# Card photo on the homepage
photo: /assets/img/about-ride.jpg
photo_alt: Steven on a ride, smiling in cycling sunglasses

# Ride stats (the homepage card, the page intro, the garage counts and the
# "By the numbers" table) come from _data/rides.json, which a GitHub Action
# refreshes every morning from the Log tab of the Strava Ride log Google Sheet.
# See _tools/sync_rides.py. Nothing to update here after a ride.

# The garage. photo is optional; without one the card shows a placeholder.
# Put bike photos in /assets/img/cycling/ and add photo: and photo_alt: lines.
# log_name must match the Bike column in the ride log exactly; it links the
# bike to its ride and mile counts and to the bike filter.
bikes:
  - name: Trek Domane SL 5 Gen 4
    photo: /assets/img/cycling/trek-domane.jpg
    photo_alt: Trek Domane SL 5 leaning against a fence
    year: "2023"
    log_name: 2023 Trek Domane SL 5 Gen 4
  - name: Fuji Sportif 2.3
    photo: /assets/img/cycling/fuji-sportif.jpg
    photo_alt: Fuji Sportif 2.3 leaning against a pole
    year: "2016"
    log_name: 2016 Fuji Sportif 2.3

# Ride photo carousel. Add as many as you like; they show in this order.
# The arrow buttons appear once there are two or more photos.
# Put new photos in /assets/img/cycling/ and add src:, alt:, and caption: lines.
rides:
  - src: /assets/img/cycling/cycling-small.jpg
    alt: Steven stopped with his bike halfway through a ride
    caption: Halfway through my "Muffin House" ride (48 miles).
  - src: /assets/img/cycling/east-bay-bike-path-borealis.jpg
    alt: Steven stopping at Borealis Coffee on the East Bay Bike Path in East Providence
    caption: Stopping at Borealis Coffee on the East Bay Bike Path in East Providence.
  - src: /assets/img/cycling/east-bay-bike-path-bristol.jpg
    alt: Steven cruising on the East Bay Bike Path entering Bristol, Rhode Island
    caption: Cruising on the East Bay Bike Path entering Bristol, Rhode Island.
  - src: /assets/img/cycling/save-the-bay.jpg
    alt: Finishing the "Four Bridges" ride for Save the Bay in Newport, Rhode Island
    caption: Finishing the "Four Bridges" ride for Save the Bay in Newport, Rhode Island.
  - src: /assets/img/cycling/milford-bike-path.jpg
    alt: Taking a break and enjoying the views on the Upper Charles Trail in Milford, MA.
    caption: Taking a break and enjoying the views on the Upper Charles Trail in Milford, MA.
  - src: /assets/img/cycling/cold-weather-ride.jpg
    alt: Start of a mid November ride in 2018, temps in the 30s.
    caption: Start of a mid November ride in 2018, temps in the 30s.
