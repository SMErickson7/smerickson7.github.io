<dl class="spec">
  {% if include.project.project_date %}<dt>Date</dt><dd>{{ include.project.project_date | date: "%B %-d, %Y" }}</dd>{% endif %}
  <dt>Goal</dt><dd>{{ include.project.goal }}</dd>
  <dt>Built with</dt><dd>{{ include.project.built_with }}</dd>
  <dt>Result</dt><dd>{{ include.project.result }}</dd>
</dl>
