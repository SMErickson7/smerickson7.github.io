<svg class="ce-svg" style="display:block;width:100%;height:auto" viewBox="0 0 740 600" role="img" aria-label="The content engine flow: brain dump, Claude drafts, I approve, then it branches to the blog, LinkedIn, Instagram and TikTok" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>.ce-svg .ce-d{font-family:var(--display,"Big Shoulders Display","Arial Narrow",sans-serif);font-weight:900}.ce-svg .ce-m{font-family:var(--mono,"Space Mono",monospace);font-weight:700;letter-spacing:.04em}.ce-svg .ce-b{font-family:var(--font,"Inter",sans-serif)}</style>
  <defs>
    <marker id="ce-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0047AB"/></marker>
  </defs>
  <rect width="740" height="600" rx="18" fill="#EEF1F7"/>

  <!-- Step 1 -->
  <rect x="210" y="32" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#1E212E" stroke-width="3"/>
  <text class="ce-m" x="370" y="58" text-anchor="middle" font-size="11" fill="#4A5068">STEP 01</text>
  <text class="ce-d" x="370" y="88" text-anchor="middle" font-size="34" fill="#1E212E">BRAIN DUMP</text>
  <text class="ce-m" x="370" y="106" text-anchor="middle" font-size="10.5" fill="#4A5068">RAW THOUGHTS, TYPED OR DICTATED</text>

  <path d="M370 116V150" stroke="#0047AB" stroke-width="3" fill="none" marker-end="url(#ce-flow-arrow)"/>

  <!-- Step 2 -->
  <rect x="210" y="156" width="320" height="84" rx="10" fill="#0047AB"/>
  <text class="ce-m" x="370" y="182" text-anchor="middle" font-size="11" fill="#C7D7F2">STEP 02</text>
  <text class="ce-d" x="370" y="212" text-anchor="middle" font-size="34" fill="#FFFFFF">CLAUDE DRAFTS</text>
  <text class="ce-m" x="370" y="230" text-anchor="middle" font-size="10.5" fill="#E3EBF8">BLOG FIRST, THEN EACH CHANNEL</text>

  <path d="M370 240V274" stroke="#0047AB" stroke-width="3" fill="none" marker-end="url(#ce-flow-arrow)"/>

  <!-- Step 3: approval stamp -->
  <g transform="rotate(-3 370 322)">
    <rect x="210" y="280" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#0047AB" stroke-width="3" stroke-dasharray="9 6"/>
    <text class="ce-m" x="370" y="306" text-anchor="middle" font-size="11" fill="#0047AB">STEP 03</text>
    <text class="ce-d" x="370" y="336" text-anchor="middle" font-size="34" fill="#0047AB">I APPROVE</text>
    <text class="ce-m" x="370" y="354" text-anchor="middle" font-size="10.5" fill="#0047AB">NOTHING POSTS WITHOUT MY YES</text>
  </g>

  <!-- Branch -->
  <g stroke="#0047AB" stroke-width="3" fill="none">
    <path d="M370 368V404"/>
    <path d="M100 404H640"/>
    <path d="M100 404V448" marker-end="url(#ce-flow-arrow)"/>
    <path d="M280 404V448" marker-end="url(#ce-flow-arrow)"/>
    <path d="M460 404V448" marker-end="url(#ce-flow-arrow)"/>
    <path d="M640 404V448" marker-end="url(#ce-flow-arrow)"/>
  </g>

  <!-- Channels -->
  <rect x="24" y="454" width="152" height="110" rx="10" fill="#1E212E"/>
  <text class="ce-d" x="100" y="500" text-anchor="middle" font-size="28" fill="#FFFFFF">BLOG</text>
  <text class="ce-m" x="100" y="524" text-anchor="middle" font-size="10" fill="#8FB3FF">ALWAYS</text>
  <text class="ce-m" x="100" y="542" text-anchor="middle" font-size="10" fill="#8FB3FF">THE PILLAR PIECE</text>

  <rect x="204" y="454" width="152" height="110" rx="10" fill="#FFFFFF" stroke="#1E212E" stroke-width="3"/>
  <text class="ce-d" x="280" y="500" text-anchor="middle" font-size="28" fill="#1E212E">LINKEDIN</text>
  <text class="ce-m" x="280" y="524" text-anchor="middle" font-size="10" fill="#4A5068">WHEN IT FITS</text>
  <text class="ce-m" x="280" y="542" text-anchor="middle" font-size="10" fill="#4A5068">FLAGS BORDERLINE</text>

  <rect x="384" y="454" width="152" height="110" rx="10" fill="#FFFFFF" stroke="#1E212E" stroke-width="3"/>
  <text class="ce-d" x="460" y="500" text-anchor="middle" font-size="28" fill="#1E212E">INSTAGRAM</text>
  <text class="ce-m" x="460" y="524" text-anchor="middle" font-size="10" fill="#4A5068">FEED AND STORY</text>
  <text class="ce-m" x="460" y="542" text-anchor="middle" font-size="10" fill="#4A5068">PERSONAL TOPICS</text>

  <rect x="564" y="454" width="152" height="110" rx="10" fill="#FFFFFF" stroke="#1E212E" stroke-width="3"/>
  <text class="ce-d" x="640" y="500" text-anchor="middle" font-size="28" fill="#1E212E">TIKTOK</text>
  <text class="ce-m" x="640" y="524" text-anchor="middle" font-size="10" fill="#4A5068">SCRIPT AND PROMPTS</text>
  <text class="ce-m" x="640" y="542" text-anchor="middle" font-size="10" fill="#4A5068">PERSONAL TOPICS</text>
</svg>
