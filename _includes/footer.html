      <p class="site-footer__title">Send a postcard</p>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>

      <a href="{{ site.social.instagram }}">Instagram</a>
      <a href="/feed.xml">RSS</a>
    </nav>
  </div>
</footer>
